name: Build LifeOS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── Repo + toolchain ─────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # ── Unpack source zip ─────────────────────────────────────────────────────
      - name: Unpack source
        run: |
          mkdir lifeos-src
          unzip -q lifeos-source.zip -d lifeos-src/

          APP_DIR=$(find lifeos-src -maxdepth 3 -name "package.json" \
            ! -path "*/node_modules/*" | head -1 | xargs dirname)

          if [ -z "$APP_DIR" ]; then
            echo "::error::package.json not found inside zip"
            exit 1
          fi
          echo "Project root: $APP_DIR"
          mv "$APP_DIR" lifeos-src/lifeos-app

      # ── Verify all 7 Kotlin templates are present ─────────────────────────────
      - name: Verify plugin templates
        working-directory: lifeos-src/lifeos-app
        run: |
          FAIL=0
          for f in \
            plugins/withAssistantService.js \
            plugins/templates/AssistantForegroundService.kt \
            plugins/templates/AssistantBridgeModule.kt \
            plugins/templates/AssistantBridgePackage.kt \
            plugins/templates/WatchdogReceiver.kt \
            plugins/templates/AssistantWatchdogJob.kt \
            plugins/templates/AlarmTriggerReceiver.kt \
            plugins/templates/BootReceiver.kt
          do
            if [ -f "$f" ]; then echo "OK  $f"
            else echo "::error::MISSING $f"; FAIL=1; fi
          done
          [ $FAIL -eq 0 ] || exit 1

      # ── npm install ───────────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: lifeos-src/lifeos-app
        run: npm install

      # ── TypeScript check ──────────────────────────────────────────────────────
      - name: TypeScript check
        working-directory: lifeos-src/lifeos-app
        run: npx tsc --noEmit

      # ── Expo prebuild (generates android/ folder + runs config plugins) ───────
      - name: Expo prebuild
        working-directory: lifeos-src/lifeos-app
        run: npx expo prebuild --platform android --clean --no-install

      # ── Add Vosk Maven repo to settings.gradle ────────────────────────────────
      # Gradle 9 resolves dependencies from dependencyResolutionManagement in
      # settings.gradle, NOT from project build.gradle allprojects.
      # The Expo plugin patches build.gradle which is ignored for deps in Gradle 9,
      # so we patch settings.gradle here as a guaranteed fix.
      - name: Add Vosk Maven repo to settings.gradle
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          sg = Path("android/settings.gradle")
          if not sg.exists():
              print("settings.gradle not found — skipping")
              import sys; sys.exit(0)

          t = sg.read_text()
          if "alphacephei" in t:
              print("alphacephei repo already present")
              import sys; sys.exit(0)

          vosk_repo = "        maven { url 'https://alphacephei.com/maven' }"

          # Gradle 9 / Expo: repositories live in dependencyResolutionManagement
          if "dependencyResolutionManagement" in t:
              t = re.sub(
                  r'(dependencyResolutionManagement\s*\{[^}]*repositories\s*\{)',
                  r'\1\n' + vosk_repo,
                  t, count=1, flags=re.DOTALL
              )
              print("Injected into dependencyResolutionManagement.repositories")
          else:
              # Fallback: inject into every repositories { } block
              t = t.replace(
                  "repositories {",
                  "repositories {\n" + vosk_repo
              )
              print("Injected into repositories blocks (fallback)")

          sg.write_text(t)

          # Also patch project build.gradle for older Gradle patterns
          bg = Path("android/build.gradle")
          if bg.exists():
              bt = bg.read_text()
              if "alphacephei" not in bt:
                  bt = re.sub(
                      r'repositories\s*\{',
                      "repositories {\n" + vosk_repo,
                      bt
                  )
                  bg.write_text(bt)
                  print("Also patched project build.gradle")
          PY

      # ── Robust package registration ───────────────────────────────────────────
      # The Expo withMainApplication plugin modifier regex can miss if Expo SDK
      # changes the generated MainApplication.kt format. This step is a guaranteed
      # fallback that tries multiple known patterns.
      - name: Register AssistantBridgePackage
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          files = list(Path("android/app/src/main/java").rglob("MainApplication.kt"))
          if not files:
              print("::warning::MainApplication.kt not found")
              sys.exit(0)

          p = files[0]
          t = p.read_text()

          if "AssistantBridgePackage" in t:
              print(f"Already registered in {p}"); sys.exit(0)

          # Pattern 1 — SDK 50/51: val packages = PackageList(this).packages
          # Pattern 2 — SDK 52+:   PackageList(this).packages.also { ... }
          # Pattern 3 — older:     return ArrayList(Arrays.asList(...))
          replaced = False
          for rx, repl in [
              (r'(val packages = PackageList\(this\)\.packages)',
               r'\1\n          packages.add(AssistantBridgePackage())'),
              (r'(PackageList\(this\)\.packages\.also\s*\{)',
               r'\1\n          it.add(AssistantBridgePackage())'),
          ]:
              if re.search(rx, t):
                  t = re.sub(rx, repl, t, count=1)
                  replaced = True
                  print(f"Registered via pattern: {rx[:40]}…")
                  break

          if not replaced:
              print("::warning::Could not auto-register — check MainApplication.kt")

          p.write_text(t)
          print(f"Done — updated {p}")
          PY

      # ── Verify manifest has all required receivers ─────────────────────────────
      - name: Verify manifest receivers
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          t = manifest_path.read_text()
          changed = False

          # Ensure BootReceiver has android:exported="true"
          if "BootReceiver" in t:
              block_start = t.find("BootReceiver")
              block_end   = t.find(">", block_start)
              block       = t[block_start:block_end]
              if 'exported="true"' not in block:
                  t = t.replace(
                      'android:name=".BootReceiver"',
                      'android:name=".BootReceiver"\n            android:exported="true"'
                  )
                  changed = True
                  print("Patched BootReceiver with exported=true")
          else:
              print("::warning::BootReceiver not in manifest — plugin may have failed")

          # Ensure WatchdogReceiver is present (it gets no intent-filter so exported=false is fine)
          for rcv in ["WatchdogReceiver", "AlarmTriggerReceiver"]:
              if rcv not in t:
                  print(f"::warning::{rcv} not found in manifest")

          if changed:
              manifest_path.write_text(t)
          else:
              print("Manifest looks correct")
          PY

      # ── Bundle SmolLM2-135M model (best-effort) ───────────────────────────────
      - name: Bundle brain model
        working-directory: lifeos-src/lifeos-app
        run: |
          mkdir -p android/app/src/main/assets/models
          curl -L --retry 3 --retry-delay 10 --max-time 300 \
            -o android/app/src/main/assets/models/assistant.gguf \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct-GGUF/resolve/main/smollm2-135m-instruct-q4_k_m.gguf" \
            && echo "Model: $(du -sh android/app/src/main/assets/models/assistant.gguf)" \
            || { echo "::warning::Model download failed — app handles this at runtime";
                 rm -f android/app/src/main/assets/models/assistant.gguf; }

      # ── Disable aapt2 compression for .gguf ──────────────────────────────────
      - name: Disable aapt2 compression for .gguf
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if 'noCompress "gguf"' not in t:
              t = t.replace("android {", 'android {\n    aaptOptions { noCompress "gguf" }\n', 1)
              p.write_text(t)
              print("aapt2 noCompress applied")
          else:
              print("Already present")
          PY

      # ── Signing keystore ──────────────────────────────────────────────────────
      - name: Create release keystore
        working-directory: lifeos-src/lifeos-app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/lifeos-release.keystore \
            -alias lifeos -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lifeos-release-pass -keypass lifeos-release-pass \
            -dname "CN=LifeOS, OU=Personal, O=LifeOS, L=Lagos, ST=Lagos, C=NG"

      # ── Signing config — brace-counting (safe for nested blocks) ─────────────
      - name: Configure Gradle signing
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          KEYSTORE = 'lifeos-release.keystore'
          PASS     = 'lifeos-release-pass'
          ALIAS    = 'lifeos'

          def closing_brace(text, open_pos):
              depth = 0
              for i in range(open_pos, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0: return i
              return -1

          p = Path('android/app/build.gradle')
          t = p.read_text()

          # 1. Add release signing config
          if KEYSTORE not in t:
              entry = (
                  '\n        release {\n'
                  f"            storeFile file('{KEYSTORE}')\n"
                  f"            storePassword '{PASS}'\n"
                  f"            keyAlias '{ALIAS}'\n"
                  f"            keyPassword '{PASS}'\n"
                  '        }'
              )
              sc = re.search(r'\bsigningConfigs\s*\{', t)
              if sc:
                  close = closing_brace(t, sc.end() - 1)
                  t = t[:close] + entry + '\n    ' + t[close:]
                  print("Added release entry to existing signingConfigs")
              else:
                  am = re.search(r'\bandroid\s*\{', t)
                  if am:
                      close = closing_brace(t, am.end() - 1)
                      block = '\n    signingConfigs {\n' + entry + '\n    }\n'
                      t = t[:close] + block + t[close:]
                      print("Created signingConfigs block")

          # 2. Wire buildTypes.release to signingConfigs.release
          bt = re.search(r'\bbuildTypes\s*\{', t)
          if bt:
              bt_open  = bt.end() - 1
              bt_close = closing_brace(t, bt_open)
              bt_inner = t[bt_open + 1:bt_close]
              rel      = re.search(r'\brelease\s*\{', bt_inner)
              if rel:
                  rel_open  = bt_open + 1 + rel.end() - 1
                  rel_close = closing_brace(t, rel_open)
                  rel_inner = t[rel_open + 1:rel_close]
                  if 'signingConfig signingConfigs.release' in rel_inner:
                      print("signingConfig already set")
                  elif 'signingConfig signingConfigs.debug' in rel_inner:
                      t = t[:rel_open+1] + rel_inner.replace(
                          'signingConfig signingConfigs.debug',
                          'signingConfig signingConfigs.release', 1
                      ) + t[rel_close:]
                      print("Replaced debug -> release signingConfig")
                  else:
                      t = t[:rel_open+1] + '\n            signingConfig signingConfigs.release' + t[rel_open+1:]
                      print("Injected signingConfig into buildTypes.release")

          p.write_text(t)

          # Debug output — print the android { } block
          t2 = p.read_text()
          am = re.search(r'\bandroid\s*\{', t2)
          if am:
              close = closing_brace(t2, am.end() - 1)
              print("\n-- android {} block --")
              print(t2[am.start():close+1])
          PY

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: lifeos-src/lifeos-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: lifeos-src/lifeos-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
