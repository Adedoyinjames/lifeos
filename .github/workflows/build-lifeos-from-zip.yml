name: Build LifeOS APK From Zip

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack LifeOS source
        run: |
          mkdir lifeos-src
          unzip -q lifeos-source.zip -d lifeos-src/

          # Auto-detect the project root — the folder that owns package.json
          APP_DIR=$(find lifeos-src -maxdepth 3 -name "package.json" \
            ! -path "*/node_modules/*" \
            | head -1 \
            | xargs dirname)

          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not locate package.json inside the zip. Check the archive structure."
            exit 1
          fi

          echo "Detected project root: $APP_DIR"
          mv "$APP_DIR" lifeos-src/lifeos-app
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/lifeos-src/lifeos-app" >> $GITHUB_ENV

      - name: Install npm dependencies
        working-directory: lifeos-src/lifeos-app
        run: npm install

      - name: TypeScript check
        working-directory: lifeos-src/lifeos-app
        run: npx tsc --noEmit

      - name: Expo prebuild (Android)
        working-directory: lifeos-src/lifeos-app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Bundle SmolLM2-135M brain (best-effort)
        working-directory: lifeos-src/lifeos-app
        run: |
          mkdir -p android/app/src/main/assets/models
          echo "Downloading SmolLM2-135M-Instruct Q4_K_M (~105 MB)..."
          curl -L --retry 3 --retry-delay 10 --max-time 300 \
            -o android/app/src/main/assets/models/assistant.gguf \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct-GGUF/resolve/main/smollm2-135m-instruct-q4_k_m.gguf" \
            && echo "Model bundled: $(du -sh android/app/src/main/assets/models/assistant.gguf)" \
            || { echo "::warning::Model download failed — onboarding screen handles it at runtime"; \
                 rm -f android/app/src/main/assets/models/assistant.gguf; }

      - name: Disable aapt2 compression for .gguf
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if 'noCompress "gguf"' not in t:
              t = t.replace("android {", 'android {\n    aaptOptions { noCompress "gguf" }\n', 1)
              p.write_text(t)
              print("aapt2 noCompress applied")
          else:
              print("Already present")
          PY

      - name: Create release signing keystore
        working-directory: lifeos-src/lifeos-app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/lifeos-release.keystore \
            -alias lifeos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lifeos-release-pass \
            -keypass  lifeos-release-pass \
            -dname "CN=LifeOS, OU=Personal, O=LifeOS, L=Lagos, ST=Lagos, C=NG"

      - name: Configure Gradle release signing
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/app/build.gradle")
          t = p.read_text()

          # 1. Inject signingConfigs block before buildTypes (only once)
          if "lifeos-release.keystore" not in t:
              signing_block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file('lifeos-release.keystore')\n"
                  "            storePassword 'lifeos-release-pass'\n"
                  "            keyAlias 'lifeos'\n"
                  "            keyPassword 'lifeos-release-pass'\n"
                  "        }\n"
                  "    }\n"
              )
              # Insert the whole signingConfigs block right before buildTypes
              t = re.sub(r'(\s*buildTypes\s*\{)', signing_block + r'\1', t, count=1)
              print("signingConfigs block inserted")
          else:
              print("signingConfigs block already present")

          # 2. Wire signingConfig into buildTypes > release (only once)
          #    Uses DOTALL so it can span multiple lines, and is anchored to
          #    buildTypes so it never accidentally matches the signingConfigs block.
          if "signingConfig signingConfigs.release" not in t:
              t = re.sub(
                  r'(buildTypes\s*\{[^}]*?release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  t,
                  count=1,
                  flags=re.DOTALL,
              )
              print("signingConfig applied to buildTypes.release")
          else:
              print("signingConfig already wired")

          # 3. Replace any leftover debug signing reference
          t = t.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          p.write_text(t)
          print("Done — build.gradle updated")
          PY

      - name: Build release APK
        working-directory: lifeos-src/lifeos-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload LifeOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: lifeos-src/lifeos-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
