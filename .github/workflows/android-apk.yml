name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Bundle models
        run: |
          mkdir -p assets/models
          curl -L -o /tmp/stt.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.en.tar.bz2
          tar -xjf /tmp/stt.tar.bz2 -C assets/models

      - name: Typecheck
        run: npm run typecheck

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Copy models
        run: |
          mkdir -p android/app/src/main/assets/models
          cp -R assets/models/* android/app/src/main/assets/models/

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/lifeos-release.keystore \
            -alias lifeos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lifeos-release-pass \
            -keypass lifeos-release-pass \
            -dname "CN=LifeOS, OU=Dev, O=LifeOS, L=Lagos, ST=Lagos, C=NG"

      - name: Inject gradle props
        run: |
          printf "\nMYAPP_UPLOAD_STORE_FILE=lifeos-release.keystore\nMYAPP_UPLOAD_KEY_ALIAS=lifeos\nMYAPP_UPLOAD_STORE_PASSWORD=lifeos-release-pass\nMYAPP_UPLOAD_KEY_PASSWORD=lifeos-release-pass\n" >> android/gradle.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
