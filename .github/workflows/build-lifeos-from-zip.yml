name: Build LifeOS APK From Zip

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Unpack & normalise the source zip ────────────────────────────────────
      - name: Unpack LifeOS source
        run: |
          mkdir lifeos-src
          unzip -q lifeos-source.zip -d lifeos-src/

          APP_DIR=$(find lifeos-src -maxdepth 3 -name "package.json" \
            ! -path "*/node_modules/*" \
            | head -1 \
            | xargs dirname)

          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not locate package.json inside the zip."
            exit 1
          fi

          echo "Detected project root: $APP_DIR"
          mv "$APP_DIR" lifeos-src/lifeos-app

      # ── Verify all required plugin template files are present ────────────────
      # Fail fast here rather than getting a cryptic prebuild error later.
      - name: Verify plugin templates
        working-directory: lifeos-src/lifeos-app
        run: |
          MISSING=0
          for FILE in \
            plugins/withAssistantService.js \
            plugins/templates/AssistantForegroundService.kt \
            plugins/templates/AssistantBridgeModule.kt \
            plugins/templates/AssistantBridgePackage.kt \
            plugins/templates/BootReceiver.kt
          do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              MISSING=1
            else
              echo "OK: $FILE"
            fi
          done
          [ $MISSING -eq 0 ] || exit 1

      - name: Install npm dependencies
        working-directory: lifeos-src/lifeos-app
        run: npm install

      - name: TypeScript check
        working-directory: lifeos-src/lifeos-app
        run: npx tsc --noEmit

      # ── Expo prebuild — generates the android/ folder and runs all plugins ───
      - name: Expo prebuild (Android)
        working-directory: lifeos-src/lifeos-app
        run: npx expo prebuild --platform android --clean --no-install

      # ── Robust package registration fallback ─────────────────────────────────
      # The withMainApplication Expo plugin modifier targets the `val packages`
      # line, but Expo codegen occasionally changes its format between versions.
      # This step guarantees AssistantBridgePackage is wired regardless.
      - name: Register AssistantBridgePackage (robust fallback)
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          matches = list(Path("android/app/src/main/java").rglob("MainApplication.kt"))
          if not matches:
              print("::warning::MainApplication.kt not found — skipping package registration")
              sys.exit(0)

          p = matches[0]
          t = p.read_text()

          if "AssistantBridgePackage" in t:
              print(f"AssistantBridgePackage already registered in {p}")
              sys.exit(0)

          # Pattern 1 — standard Expo SDK 50/51 shape
          p1 = r'(val packages = PackageList\(this\)\.packages)'
          # Pattern 2 — Expo SDK 52+ shape with .also { }
          p2 = r'(PackageList\(this\)\.packages\.also\s*\{)'
          # Pattern 3 — packages list as mutableListOf
          p3 = r'(override fun getPackages\(\)[^{]*\{[^r]*return\s+)'

          if re.search(p1, t):
              t = re.sub(p1,
                  r'\1\n          packages.add(AssistantBridgePackage())',
                  t, count=1)
              print("Registered via pattern 1 (val packages)")
          elif re.search(p2, t):
              t = re.sub(p2,
                  r'\1\n          it.add(AssistantBridgePackage())',
                  t, count=1)
              print("Registered via pattern 2 (.also)")
          else:
              # Last resort: append to the first return statement in getPackages()
              t = re.sub(
                  r'(override fun getPackages\(\)[^{]*\{)',
                  r'\1\n          val _extra = mutableListOf<com.facebook.react.ReactPackage>(AssistantBridgePackage())',
                  t, count=1)
              # And make the return include it
              print("::warning::Used last-resort registration — verify MainApplication.kt manually")

          p.write_text(t)
          print(f"Done — updated {p}")
          PY

      # ── Validate AndroidManifest has exported=true on BootReceiver ───────────
      # Android 12+ (API 31+) rejects receivers with intent-filters that do
      # not explicitly declare android:exported. Our plugin sets it, but we
      # verify here so the build never silently omits it.
      - name: Verify BootReceiver is exported in manifest
        working-directory: lifeos-src/lifeos-app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "BootReceiver" "$MANIFEST"; then
            echo "::error::BootReceiver not found in AndroidManifest.xml — plugin registration failed"
            cat "$MANIFEST"
            exit 1
          fi
          if ! grep -A5 "BootReceiver" "$MANIFEST" | grep -q 'exported="true"'; then
            echo "::warning::BootReceiver may be missing android:exported=true — patching"
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          if "BootReceiver" in t and 'exported="true"' not in t.split("BootReceiver")[1].split(">")[0]:
              t = t.replace(
                  'android:name=".BootReceiver"',
                  'android:name=".BootReceiver"\n            android:exported="true"'
              )
              p.write_text(t)
              print("Patched BootReceiver with android:exported=true")
          else:
              print("BootReceiver manifest entry looks correct")
          PY
          else
            echo "BootReceiver manifest entry OK"
          fi

      # ── Bundle model (best-effort — onboarding handles missing model) ────────
      - name: Bundle SmolLM2-135M brain (best-effort)
        working-directory: lifeos-src/lifeos-app
        run: |
          mkdir -p android/app/src/main/assets/models
          echo "Downloading SmolLM2-135M-Instruct Q4_K_M (~105 MB)..."
          curl -L --retry 3 --retry-delay 10 --max-time 300 \
            -o android/app/src/main/assets/models/assistant.gguf \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct-GGUF/resolve/main/smollm2-135m-instruct-q4_k_m.gguf" \
            && echo "Model bundled: $(du -sh android/app/src/main/assets/models/assistant.gguf)" \
            || { echo "::warning::Model download failed - onboarding screen handles it at runtime"; \
                 rm -f android/app/src/main/assets/models/assistant.gguf; }

      # ── Prevent aapt2 from compressing the .gguf model ──────────────────────
      - name: Disable aapt2 compression for .gguf
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if 'noCompress "gguf"' not in t:
              t = t.replace("android {", 'android {\n    aaptOptions { noCompress "gguf" }\n', 1)
              p.write_text(t)
              print("aapt2 noCompress applied")
          else:
              print("Already present")
          PY

      # ── Keystore ─────────────────────────────────────────────────────────────
      - name: Create release signing keystore
        working-directory: lifeos-src/lifeos-app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/lifeos-release.keystore \
            -alias lifeos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lifeos-release-pass \
            -keypass  lifeos-release-pass \
            -dname "CN=LifeOS, OU=Personal, O=LifeOS, L=Lagos, ST=Lagos, C=NG"

      # ── Signing config — brace-counting (immune to nested blocks) ────────────
      - name: Configure Gradle release signing
        working-directory: lifeos-src/lifeos-app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          KEYSTORE = 'lifeos-release.keystore'
          PASS     = 'lifeos-release-pass'
          ALIAS    = 'lifeos'

          def closing_brace(text, open_pos):
              depth = 0
              for i in range(open_pos, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          p = Path('android/app/build.gradle')
          t = p.read_text()

          # 1. Add release entry to signingConfigs
          if KEYSTORE not in t:
              release_entry = (
                  '\n        release {\n'
                  f"            storeFile file('{KEYSTORE}')\n"
                  f"            storePassword '{PASS}'\n"
                  f"            keyAlias '{ALIAS}'\n"
                  f"            keyPassword '{PASS}'\n"
                  '        }'
              )
              sc_m = re.search(r'\bsigningConfigs\s*\{', t)
              if sc_m:
                  close = closing_brace(t, sc_m.end() - 1)
                  if close != -1:
                      t = t[:close] + release_entry + '\n    ' + t[close:]
                      print('Inserted release entry into existing signingConfigs block')
              else:
                  android_m = re.search(r'\bandroid\s*\{', t)
                  if android_m:
                      android_close = closing_brace(t, android_m.end() - 1)
                      new_block = (
                          '\n    signingConfigs {\n'
                          + release_entry + '\n'
                          + '    }\n'
                      )
                      t = t[:android_close] + new_block + t[android_close:]
                      print('Created signingConfigs block inside android {}')
          else:
              print('Keystore already configured')

          # 2. Point buildTypes.release at signingConfigs.release
          #    Uses brace-counting to avoid matching inside the debug {} block.
          bt_m = re.search(r'\bbuildTypes\s*\{', t)
          if bt_m:
              bt_open  = bt_m.end() - 1
              bt_close = closing_brace(t, bt_open)
              bt_inner = t[bt_open + 1 : bt_close]

              rel_m = re.search(r'\brelease\s*\{', bt_inner)
              if rel_m:
                  rel_open  = bt_open + 1 + (rel_m.end() - 1)
                  rel_close = closing_brace(t, rel_open)
                  rel_inner = t[rel_open + 1 : rel_close]

                  if 'signingConfig signingConfigs.release' in rel_inner:
                      print('signingConfig already points to release')
                  elif 'signingConfig signingConfigs.debug' in rel_inner:
                      t = t[:rel_open + 1] + rel_inner.replace(
                          'signingConfig signingConfigs.debug',
                          'signingConfig signingConfigs.release', 1,
                      ) + t[rel_close:]
                      print('Replaced debug signingConfig with release')
                  else:
                      t = t[:rel_open + 1] + '\n            signingConfig signingConfigs.release' + t[rel_open + 1:]
                      print('Injected signingConfig into buildTypes.release')
              else:
                  print('WARNING: release block not found inside buildTypes')
          else:
              print('WARNING: buildTypes block not found')

          p.write_text(t)

          # Print result for CI debugging
          t2 = p.read_text()
          am = re.search(r'\bandroid\s*\{', t2)
          if am:
              close = closing_brace(t2, am.end() - 1)
              print('\n-- Final android {} block --')
              print(t2[am.start() : close + 1])
          print('Done')
          PY

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: lifeos-src/lifeos-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload LifeOS APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: lifeos-src/lifeos-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
