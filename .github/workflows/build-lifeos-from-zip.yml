name: Build LifeOS APK From Zip

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack LifeOS source
        run: |
          mkdir lifeos-src
          unzip -q lifeos-source.zip -d lifeos-src/

      - name: Install dependencies
        working-directory: lifeos-src/lifeos-fixed
        run: npm install

      - name: TypeScript check
        working-directory: lifeos-src/lifeos-fixed
        run: npx tsc --noEmit

      - name: Expo prebuild (Android)
        working-directory: lifeos-src/lifeos-fixed
        run: npx expo prebuild --platform android --clean --no-install

      - name: Download SmolLM2 GGUF model (on-device brain)
        run: |
          mkdir -p lifeos-src/lifeos-fixed/android/app/src/main/assets/models
          curl -L \
            --retry 5 --retry-delay 10 \
            -o lifeos-src/lifeos-fixed/android/app/src/main/assets/models/assistant.gguf \
            "https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct-GGUF/resolve/main/smollm2-135m-instruct-q4_k_m.gguf"
          echo "Model size: $(du -sh lifeos-src/lifeos-fixed/android/app/src/main/assets/models/assistant.gguf)"

      - name: Create release signing key
        working-directory: lifeos-src/lifeos-fixed
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/lifeos-release.keystore \
            -alias lifeos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass lifeos-release-pass \
            -keypass  lifeos-release-pass \
            -dname "CN=LifeOS, OU=Personal, O=LifeOS, L=Lagos, ST=Lagos, C=NG"

      - name: Configure release signing
        working-directory: lifeos-src/lifeos-fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "lifeos-release.keystore" not in text:
              text = text.replace(
                  "signingConfigs {",
                  """signingConfigs {
                  release {
                      storeFile file('lifeos-release.keystore')
                      storePassword 'lifeos-release-pass'
                      keyAlias 'lifeos'
                      keyPassword 'lifeos-release-pass'
                  }
          """,
                  1,
              )
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1,
              )
          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release",
          )
          path.write_text(text)
          print("Signing config applied.")
          PY

      - name: Disable aapt2 compression for .gguf model asset
        working-directory: lifeos-src/lifeos-fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if 'noCompress "gguf"' not in text:
              text = text.replace(
                  "android {",
                  'android {\n    aaptOptions { noCompress "gguf" }\n',
                  1,
              )
          path.write_text(text)
          print("aapt2 noCompress applied.")
          PY

      - name: Build release APK
        working-directory: lifeos-src/lifeos-fixed/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-release-apk
          path: lifeos-src/lifeos-fixed/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
